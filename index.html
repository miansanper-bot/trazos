:root{
  --bg:#e0f2fe; --ink:#1e293b; --muted:#64748b; --card:#FFFFFF; --line:#cfe3f3;
  --pri:#3b82f6; --pri2:#60a5fa; --acc:#f97316; --good:#22c55e; --bad:#ef4444; --star:#facc15;
  --r:26px; --sh:0 6px 0 rgba(30,64,120,.12), 0 12px 26px rgba(30,64,120,.10);
  --font:"Fredoka","Andika",ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{font-family:inherit;-webkit-user-select:text;user-select:text}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
h1,h2,h3{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1}

/* Buttons */
.btn{border:0;border-radius:14px;padding:12px 18px;font-size:1rem;font-weight:800;background:var(--pri);color:#fff;box-shadow:0 4px 0 #1E2A66;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1E2A66}
.btn.acc{background:var(--acc);box-shadow:0 4px 0 #C9561A}
.btn.good{background:var(--good);box-shadow:0 4px 0 #137A4F}
.btn.danger{background:var(--bad);box-shadow:0 4px 0 #A82D31}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.big{font-size:1.25rem;padding:16px 24px;border-radius:18px}
.btn.sm{padding:8px 12px;font-size:.9rem;border-radius:11px}
.ibtn{border:0;background:#fff;border-radius:14px;width:52px;height:52px;font-size:1.5rem;font-weight:900;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:9px 13px;font-weight:800;font-size:.95rem}
.seg button.on{background:var(--pri);border-color:var(--pri);color:#fff}

/* Layout */
.wrap{max-width:1180px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-top:18px}
.card h2{font-size:1.3rem;margin-bottom:12px}
.hero{display:flex;align-items:center;gap:16px;padding-top:max(6px,env(safe-area-inset-top))}
.logo{width:68px;height:68px;border-radius:20px;background:var(--acc);display:grid;place-items:center;font-size:2.3rem;box-shadow:0 5px 0 #C9561A}
.hero h1{font-size:2.2rem;letter-spacing:.5px}
.tag{margin:2px 0 0;font-weight:800;color:var(--acc);font-size:1.1rem}
.warn{background:#FFF0D6;border:2px solid #FFCF7A;border-radius:14px;padding:10px 14px;margin-top:14px;font-weight:700}

/* Avatars */
.avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px;margin-top:14px}
.av{border:0;background:#fff;border-radius:22px;padding:14px 8px 12px;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 55%,#000 0%),0 8px 20px rgba(0,0,0,.06);border-top:8px solid var(--c);display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.av:active{transform:translateY(3px)}
.emo{font-size:3rem;line-height:1}
.nm{font-weight:900;font-size:1.05rem;text-align:center;word-break:break-word}
.pts{font-size:.85rem;color:var(--muted);font-weight:800}

/* Student hub */
.shead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bigav{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;font-size:3rem;background:#fff;box-shadow:var(--sh);border:5px solid var(--c)}
.stat{background:#fff;border-radius:14px;padding:8px 14px;font-weight:900;box-shadow:0 3px 0 var(--line)}
.lvl{background:var(--pri);color:#fff}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mcardx{border:3px solid var(--line);border-radius:18px;padding:14px;background:#FFFCF5;display:flex;flex-direction:column;gap:10px}
.mcardx.done{border-color:var(--good);background:#F0FBF5}
.mcardx h3{font-size:1.1rem}
.bar{height:14px;border-radius:9px;background:#EFE6D2;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--star));border-radius:9px}
.mprev{display:flex;gap:6px;flex-wrap:wrap}
.mprev .pv{width:38px;height:38px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:14px}
.ibox{border:3px solid var(--line);background:#fff;border-radius:16px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);position:relative}
.ibox:active{transform:scale(.96)}
.ibox .pv{width:100%;height:70px}
.ibox span{font-size:.75rem;font-weight:800;text-align:center;line-height:1.1;color:var(--muted)}
.ibox .st{position:absolute;top:4px;right:6px;font-size:.75rem}
.ibox.on{border-color:var(--pri);background:#EEF1FF}
.pv{display:block}
.pv .o{fill:none;stroke:var(--pri);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}

  for(const ch of str){

    const base=ACC[ch]||ch;const g=glyphFor(base,style);if(!g)continue;
    const isCur=style==='cursive'&&CURSIVE[base]===g;
    g.s.forEach((d,k)=>{

    strokes.forEach(d=>samplePath(d,2).pts.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);}));
    const cy=(y0+y1)/2,hh=Math.max(36,(y1-y0)/2+9);box={x0:x0-9,x1:x1+9,y0:cy-hh,y1:cy+hh};
  }else{

let AC=null;

function tone(f,d,type='sine',v=.14,when=0){
  if(!DB.settings.sound||!AC)return;
  try{const t=AC.currentTime+when;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);}catch(e){}
}
const SFX={

function sfx(k){SFX[k]&&SFX[k]();}
function say(t){
  if(!DB.settings.voice||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';const v=speechSynthesis.getVoices().find(v=>/^es(-|_)ES/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^es/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}
}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;const c=v=>Math.max(0,Math.min(255,v));return '#'+((1<<24)|(c(r)<<16)|(c(g)<<8)|c(b)).toString(16).slice(1);}

/* ============================ MOTOR DE TRAZO ============================
   Modo 'ball': hay que arrastrar la bola; solo avanza por el camino y en el sentido correcto.
   Modo 'free': el dedo traza; se dibuja la tinta (verde dentro / roja fuera).
   Mide: tiempo, precisión (% de recorrido dentro del carril), salidas,
   errores de dirección (ir hacia atrás o empezar por otro sitio), levantamientos. */
class TraceEngine{
  constructor(stage,item,cfg,hooks){
    this.stage=stage;this.item=item;this.cfg=cfg;this.hooks=hooks||{};
    this.cv=document.createElement('canvas');this.cv.className='tcv';stage.appendChild(this.cv);
    this.ctx=this.cv.getContext('2d');
    this.si=0;this.p=0;this.done=false;this.active=null;this.wasIn=true;this.back=0;this.lastDir=0;this.flashT=-1e9;
    this.m={t0:0,t1:0,inS:0,totS:0,outs:0,dir:0,lifts:0,inval:0};this.ink=[];this.lastMoveT=0;
    this.color=cfg.color||'#FF7A30';
    this._d=e=>this.down(e);this._m=e=>this.move(e);this._u=e=>this.up(e);
    const cv=this.cv;cv.addEventListener('pointerdown',this._d);cv.addEventListener('pointermove',this._m);
    cv.addEventListener('pointerup',this._u);cv.addEventListener('pointercancel',this._u);
    this._t=e=>e.preventDefault();cv.addEventListener('touchstart',this._t,{passive:false});cv.addEventListener('touchmove',this._t,{passive:false});
    this.ro=new ResizeObserver(()=>this.layout());this.ro.observe(stage);
    this.layout();this.raf=requestAnimationFrame(t=>this.loop(t));
  }
  destroy(){cancelAnimationFrame(this.raf);this.ro.disconnect();this.cv.remove();this.dead=true;}
  get S(){return this.strokes&&this.strokes[Math.min(this.si,this.strokes.length-1)];}
  layout(){
    const W=this.stage.clientWidth,H=this.stage.clientHeight;if(!W||!H)return;
    const dpr=Math.min(window.devicePixelRatio||1,2.5);
    this.W=W;this.H=H;this.dpr=dpr;this.cv.width=Math.round(W*dpr);this.cv.height=Math.round(H*dpr);
    const b=this.item.box,bw=b.x1-b.x0,bh=b.y1-b.y0,pad=Math.max(14,Math.min(W,H)*.035);
    const fit=Math.min((W-2*pad)/bw,(H-2*pad)/bh);this.sc=fit*SIZE_F[(this.cfg.size||1)-1];
    this.ox=(W-bw*this.sc)/2-b.x0*this.sc;this.oy=(H-bh*this.sc)/2-b.y0*this.sc;
    this.track=Math.max(18,TRACK_U*this.sc);this.stepPx=Math.max(1.5,this.track/14);
    const stepU=this.stepPx/this.sc;const ratio=this.S?this.p/Math.max(1,this.S.pts.length-1):0;
    let lenU=0;
    this.strokes=this.item.strokes.map(s=>{
      const sm=samplePath(s.d,stepU);lenU+=sm.L;
      const pts=sm.pts.map(q=>({x:q.x*this.sc+this.ox,y:q.y*this.sc+this.oy}));const n=pts.length;
      const tan=pts.map((q,i)=>{const a=pts[Math.max(0,i-2)],c=pts[Math.min(n-1,i+2)];const dx=c.x-a.x,dy=c.y-a.y,l=Math.hypot(dx,dy)||1;return{x:dx/l,y:dy/l};});
      return{pts,tan,tap:sm.L<2.5};
    });
    this.lenU=lenU;if(this.si<this.strokes.length)this.p=Math.round(ratio*(this.S.pts.length-1));
    this.ink=[];this.active=null;
  }
  pos(e){const r=this.cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
  begin(){if(!this.m.t0){this.m.t0=performance.now();this.hooks.onStart&&this.hooks.onStart();}}
  hint(msg,kind){this.hooks.onHint&&this.hooks.onHint(msg,kind);}
  emit(){this.hooks.onStats&&this.hooks.onStats(this.m);}
  down(e){
    unlockAudio();
    if(this.done||this.active!==null)return;e.preventDefault();
    const q=this.pos(e),S=this.S;
    if(S.tap){
      if(dist(q,S.pts[0])<=Math.max(this.track*.9,26)){this.begin();this.m.inS++;this.m.totS++;this.strokeDone();}
      else this.hint('Toca dentro del punto');

    }
    const cur=S.pts[this.p];const ball=this.cfg.mode==='ball';

    if(dist(q,cur)<=R){

      this.begin();this.last=q;this.wasIn=true;this.back=0;this.lastMoveT=performance.now();this.lastMoveP=q;
      if(!ball)this.ink.push({pts:[q],ok:[true]});else SFX.grab();
    }else{
      const g=nearest(S.pts,q,0,S.pts.length-1);
      if(!ball&&g.d<=this.track*.6&&Math.abs(g.i-this.p)*this.stepPx>this.track*1.2){this.begin();this.dirErr(this.p===0?'¡Empieza en el punto verde!':'¡Sigue desde donde lo dejaste!');}

  feed(q){

  step(r,mv){
    const S=this.S,n=S.pts.length,half=this.track/2,tol=half*(STRICT[this.cfg.strict]||1.2);
    const A=Math.ceil(this.track*1.3/this.stepPx),B=Math.ceil(this.track*.6/this.stepPx);
    const f=nearest(S.pts,r,this.p,Math.min(n-1,this.p+A));
    const b=this.p>0?nearest(S.pts,r,Math.max(0,this.p-B),this.p-1):{i:-1,d:Infinity};
    const w=(f.d<=b.d+this.track*.25)?f:b;

    const ok=w.d<=tol;
    if(this.cfg.mode==='free'){const s=this.ink[this.ink.length-1];if(s){s.pts.push(r);s.ok.push(ok);}}
    if(ok){
      const ml=Math.hypot(mv.x,mv.y);
      if(ml>.3){const t=S.tan[this.p];const dot=(mv.x*t.x+mv.y*t.y)/ml;if(w===b&&dot<-.5)this.back+=ml;else if(dot>.3)this.back=Math.max(0,this.back-ml);}

      if(w.i>this.p)this.p=w.i;
      this.wasIn=true;
      const slack=Math.min(Math.ceil(this.track*.3/this.stepPx),Math.floor(n*.12));
      if(this.p>=n-1-slack){this.strokeDone();return;}
    }else if(this.p>0&&(this._g=nearest(S.pts,r,0,this.p)).d<=tol){

      // sigue dentro del camino pero retrocediendo por la parte ya hecha: es error de dirección, no salida
      this.back+=Math.hypot(mv.x,mv.y);if(this.back>this.track*.8){this.back=0;this.dirErr('¡Al revés! Sigue las flechas');}
    }else if(this.wasIn){
      this.wasIn=false;this.m.outs++;SFX.out();try{navigator.vibrate&&navigator.vibrate(50);}catch(_){}

  }

  release(){if(this.active!==null){try{this.cv.releasePointerCapture(this.active);}catch(_){}}this.active=null;}
  up(e){if(e.pointerId!==this.active)return;this.release();if(!this.done)this.invalidate('lift');}
  /* Levantar el dedo a mitad de un trazo o quedarse parado: el intento no vale y se empieza de nuevo. */
  invalidate(kind){
    const iv=this.m.inval+1;this.release();
    this.si=0;this.p=0;this.back=0;this.wasIn=true;this.ink=[];
    this.m={t0:0,t1:0,inS:0,totS:0,outs:0,dir:0,lifts:0,inval:iv};
    SFX.dir();try{navigator.vibrate&&navigator.vibrate([80,60,80]);}catch(_){}
    this.flashT=performance.now();

  }
  strokeDone(){
    this.release();this.si++;this.p=0;this.back=0;this.wasIn=true;

    SFX.stroke();this.emit();
  }
  finish(){

      this.item.guides.forEach(u=>{const y=u*this.sc+this.oy;c.beginPath();c.moveTo(10,y);c.lineTo(this.W-10,y);
        c.lineWidth=u===70?2.5:1.5;c.strokeStyle=u===70?'rgba(229,72,77,.5)':'rgba(47,62,143,.25)';c.setLineDash(u===40?[9,9]:[]);c.stroke();});

    const poly=(pts,a=0,b=pts.length-1)=>{c.beginPath();c.moveTo(pts[a].x,pts[a].y);for(let i=a+1;i<=b;i++)c.lineTo(pts[i].x,pts[i].y);if(a===b)c.lineTo(pts[a].x+.01,pts[a].y);};
    const border=Math.max(3,T*.09);
    c.strokeStyle='#2F3E8F';c.lineWidth=T;this.strokes.forEach(S=>{poly(S.pts);c.stroke();});
    c.strokeStyle='#FFFFFF';c.lineWidth=T-2*border;this.strokes.forEach(S=>{poly(S.pts);c.stroke();});
    c.strokeStyle=this.color;c.globalAlpha=.8;c.lineWidth=Math.max(4,T-2*border-Math.max(4,T*.14));

    const S=this.S,helps=cfg.helps||'full';

        this.strokes.forEach((S2,k)=>{if(k>this.si)this.badge(S2.pts[0],k+1,'rgba(47,62,143,.32)',Math.max(9,T*.22));});
        if(!S.tap){
          const gap=Math.max(3,Math.round(T*1.4/this.stepPx));c.strokeStyle='rgba(47,62,143,.5)';c.lineWidth=Math.max(2,T*.07);
          for(let i=this.p+gap,c5=0;i<S.pts.length-gap/2&&c5<5;i+=gap,c5++){const q=S.pts[i],t=S.tan[i],s=T*.17;c.beginPath();c.moveTo(q.x-t.x*s-t.y*s,q.y-t.y*s+t.x*s);c.lineTo(q.x+t.x*s*.6,q.y+t.y*s*.6);c.lineTo(q.x-t.x*s+t.y*s,q.y-t.y*s-t.x*s);c.stroke();}
          const e=S.pts[S.pts.length-1];c.beginPath();c.arc(e.x,e.y,T*.2,0,PI2);c.strokeStyle='#FF7A30';c.lineWidth=Math.max(2,T*.07);c.stroke();
        }

      if(cfg.mode==='free'||S.tap){
        if(helps!=='none'||flash>0||S.tap){const q=S.pts[this.p];const r=Math.max(11,T*.3)*(1+flash*.3);this.badge(q,helps==='full'?this.si+1:null,'#22A06B',r,true);}
      }
    }
    if(this.ink.length){c.lineWidth=Math.max(5,T*.2);this.ink.forEach(s=>{for(let i=1;i<s.pts.length;i++){c.strokeStyle=s.ok[i]?'#23304F':'#E5484D';c.beginPath();c.moveTo(s.pts[i-1].x,s.pts[i-1].y);c.lineTo(s.pts[i].x,s.pts[i].y);c.stroke();}});}
    if(cfg.mode==='ball'&&(!S.tap||this.done)){
      const q=this.done?S.pts[S.pts.length-1]:S.pts[this.p];
      const idle=this.active===null&&!this.done;const pul=idle?(Math.sin(ts/220)*.08+1.05):1;
      const R=Math.max(13,T*.42)*pul*(1+flash*.15);
      const g=c.createRadialGradient(q.x-R*.35,q.y-R*.35,R*.1,q.x,q.y,R);
      g.addColorStop(0,'#fff');g.addColorStop(.35,this.color);g.addColorStop(1,shade(this.color,-40));
      c.fillStyle=g;c.beginPath();c.arc(q.x,q.y,R,0,PI2);c.fill();c.lineWidth=2;c.strokeStyle='rgba(0,0,0,.25)';c.stroke();
    }

}

function studentStats(sid){
  const s={count:0,perfect:0,freePerfect:0,maxSize:0,grafo:0,letters:0,digits:0,cursive:0,stars:0};const L=new Set(),D=new Set();
  DB.results.forEach(r=>{if(r.sid!==sid)return;s.count++;s.stars+=r.stars;if(r.stars===3){s.perfect++;if(r.mode==='free')s.freePerfect++;}s.maxSize=Math.max(s.maxSize,r.size||1);
    if(r.set==='grafo')s.grafo++;if(['upper','lower','cursive'].includes(r.set))L.add(r.set+r.item);if(r.set==='digits')D.add(r.item);if(r.set==='cursive'||(r.set==='text'&&r.style==='cursive'))s.cursive++;});
  s.letters=L.size;s.digits=D.size;return s;
}
function checkBadges(st){const s=studentStats(st.id);st.badges=st.badges||[];const nb=[];BADGES.forEach(b=>{if(!st.badges.includes(b.id)&&b.t(s,st)){st.badges.push(b.id);nb.push(b);}});return nb;}
function levelOf(p){const l=Math.floor((p||0)/150);return{n:l+1,name:LEVELS[Math.min(l,LEVELS.length-1)],next:(l+1)*150};}
function starsFor(r){if(r.prec>=90&&r.outs===0&&r.dir===0)return 3;if(r.prec>=75&&r.outs<=2&&r.dir<=1)return 2;return 1;}
function recKey(set,style,key,cfg){return `${set}|${styleOf(set,style)||''}|${key}|${cfg.mode}|${cfg.size}`;}
function checkRecord(st,set,style,key,cfg,res){
  const R=DB.records[st.id]||(DB.records[st.id]={});const k=recKey(set,style,key,cfg);const o=R[k];
  if(!o){R[k]={t:res.t,prec:res.prec};return null;}
  const msg=[];
  if(res.stars>=2&&res.t<o.t){msg.push(`⏱️ ¡Más rápido que nunca! Antes ${fmt(o.t)} s`);o.t=res.t;}
  if(res.prec>o.prec){msg.push(`🎯 ¡Más preciso que nunca! Antes ${o.prec}%`);o.prec=res.prec;}
  return msg.length?msg:null;
}
function aProgress(a,sid){
  const cnt={};DB.results.forEach(r=>{if(r.aid===a.id&&r.sid===sid)cnt[r.item]=(cnt[r.item]||0)+1;});
  let done=0,itemsDone=0;const reps=a.cfg.reps;a.items.forEach(k=>{const c=Math.min(cnt[k]||0,reps);done+=c;if(c>=reps)itemsDone++;});
  const tot=a.items.length*reps;return{done,tot,pct:tot?Math.round(done/tot*100):0,itemsDone,cnt};
}

function repStartFor(ss){if(!ss.aid||!S.sid)return 0;const a=DB.assignments.find(x=>x.id===ss.aid);if(!a)return 0;const c=aProgress(a,S.sid).cnt[ss.items[ss.idx]]||0;return c>=ss.cfg.reps?0:c;}
function stopPlay(){if(S.engine){S.engine.destroy();S.engine=null;}clearInterval(S.timerIv);clearTimeout(S.autoT);S.timerIv=null;}
let toastT=null;
function toast(msg,kind){const t=$('#toast');if(!t)return;t.textContent=msg;t.className='toast on '+(kind||'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast',1300);}
function renderPlay(){
  stopPlay();
  const ss=S.session,cfg=ss.cfg,key=ss.items[ss.idx],st=student();
  const it=getItem(ss.set,ss.style,key);
  const rec=st&&(DB.records[st.id]||{})[recKey(ss.set,ss.style,key,cfg)];

  app.innerHTML=`<div class="play">
   <header class="pbar"><button class="ibtn" data-act="quit" aria-label="Salir">✕</button>
    <div class="ptitle"><span class="pset">${esc(ss.title||setLabel(ss.set,ss.style))}${ss.items.length>1?` · ${ss.idx+1}/${ss.items.length}`:''}</span><b>${esc(it.label)}</b></div>
    <div class="reps" title="Repeticiones">${[...Array(reps)].map((_,i)=>`<i class="${i<ss.rep?'d':i===ss.rep?'c':''}"></i>`).join('')}</div>
    <div class="pmeta"><span class="timer" id="timer">0,0 s</span>${rec?`<span class="rec">🏁 Récord ${fmt(rec.t)} s · ${rec.prec}%</span>`:'<span class="rec">¡Primer intento!</span>'}</div>

  </div>`;
  const stage=$('#stage');const Eng=(ACTIVITIES[ss.activity||'trace']||ACTIVITIES.trace).Engine;
  S.engine=new Eng(stage,it,Object.assign({},cfg,{color:st?st.color:'#FF7A30'}),{
    onHint:(m,k)=>toast(m,k),
    onInvalid:()=>{const st=$('#stage');if(st){st.classList.remove('shake');void st.offsetWidth;st.classList.add('shake');}},
    onStats:m=>{const p=$('#mPrec');if(!p)return;p.textContent=m.totS?Math.round(m.inS/m.totS*100):100;$('#mOut').textContent=m.outs;$('#mDir').textContent=m.dir;},
    onFinish:res=>onFinish(res)
  });
  S.timerIv=setInterval(()=>{const e=S.engine,t=$('#timer');if(!e||!t)return;const v=e.m.t0?((e.done?e.m.t1:performance.now())-e.m.t0)/1000:0;t.textContent=fmt(v)+' s';},100);
  if(ss.rep===0&&!ss.announced){ss.announced=true;toast(cfg.mode==='ball'?'Arrastra la bola por el camino':'Traza con el dedo desde el punto verde','good');}
}
const CHEERS=['¡Muy bien!','¡Genial!','¡Lo has conseguido!','¡Fantástico!','¡Eres un crack!','¡Bravo!'];
function onFinish(res){
  const ss=S.session,key=ss.items[ss.idx],st=student(),cfg=ss.cfg;
  res.stars=starsFor(res);let rec=null,pts=0,nb=[],missionDone=false;
  if(st){
    rec=checkRecord(st,ss.set,ss.style,key,cfg,res);
    DB.results.push({id:uid(),sid:st.id,aid:ss.aid||null,activity:ss.activity||'trace',set:ss.set,style:styleOf(ss.set,ss.style),item:key,mode:cfg.mode,size:cfg.size,strict:cfg.strict,helps:cfg.helps,
      t:res.t,prec:res.prec,outs:res.outs,dir:res.dir,inval:res.inval||0,speed:res.speed,stars:res.stars,rec:!!rec,date:new Date().toISOString()});
    pts=res.stars*10+(cfg.size-1)*2+(rec?5:0);st.points=(st.points||0)+pts;if(rec)st.recs=(st.recs||0)+1;
    if(ss.aid){const a=DB.assignments.find(x=>x.id===ss.aid);if(a){const pr=aProgress(a,st.id);st.missions=st.missions||[];if(pr.done>=pr.tot&&!st.missions.includes(a.id)){st.missions.push(a.id);st.points+=30;pts+=30;missionDone=true;}}}
    nb=checkBadges(st);save();
  }
  ss.rep++;ss.runs.push(res);
  sfx(res.stars===3?'win':'ok');if(rec)sfx('rec');
  confetti(res.stars+(rec?2:0)+(missionDone?3:0));
  const itemDone=ss.rep>=cfg.reps;
  say(missionDone?'¡Misión cumplida!':rec?'¡Nuevo récord! ¡Te has superado!':CHEERS[Math.floor(Math.random()*CHEERS.length)]);
  const stars=[1,2,3].map(i=>`<span class="${i<=res.stars?'':'off'}">⭐</span>`).join('');
  const grid=`<div class="rgrid"><div><b>${fmt(res.t)}s</b><span>Tiempo</span></div><div><b>${res.prec}%</b><span>Precisión</span></div><div><b>${res.outs}</b><span>Salidas</span></div><div><b>${res.dir}</b><span>Dirección</span></div></div>${res.inval?`<div class="muted small" style="font-weight:800">🔁 Ha empezado de nuevo ${res.inval} ${res.inval===1?'vez':'veces'}</div>`:''}`;
  let extra=(rec?rec.map(m=>`<div class="recmsg">🏆 ¡NUEVO RÉCORD! ${m}</div>`).join(''):'')+(nb.length?`<div class="newb">🎉 ¡Medalla nueva! ${nb.map(b=>b.i+' '+b.n).join(' · ')}</div>`:'')+(missionDone?`<div class="recmsg">🎯 ¡MISIÓN CUMPLIDA! +30 puntos</div>`:'')+(pts?`<div class="muted small" style="font-weight:800">+${pts} puntos</div>`:'');
  let btns='';
  if(!itemDone){
    btns=`<button class="btn good big" data-act="nextrep">Siguiente ➜ (${ss.rep+1}/${cfg.reps})</button><button class="btn ghost" data-act="quit">Salir</button>`;
  }else{
    const runs=ss.runs;const bt=Math.min(...runs.map(r=>r.t)),bp=Math.max(...runs.map(r=>r.prec));
    extra+=`<div class="newb">✅ ${esc(itemLabel(ss.set,key))} ×${cfg.reps} · Mejor tiempo ${fmt(bt)} s · Mejor precisión ${bp}%</div>`;
    const hasNext=ss.idx<ss.items.length-1;const avg=runs.reduce((a,r)=>a+r.stars,0)/runs.length;
    if(hasNext)btns+=`<button class="btn good big" data-act="nextitem">Siguiente: ${esc(itemLabel(ss.set,ss.items[ss.idx+1]))} ➜</button>`;
    if(!ss.aid&&cfg.size<5&&avg>=2)btns+=`<button class="btn acc big" data-act="smaller">🚀 ¡Supérate! Más pequeña</button>`;
    btns+=`<button class="btn ghost" data-act="again">↺ Otra vez</button><button class="btn ${hasNext?'ghost':'good'}" data-act="quit">${hasNext?'Salir':'Terminar'}</button>`;
  }
  const ov=document.createElement('div');ov.className='rover';
  ov.innerHTML=`<div class="rcard"><div class="stars">${stars}</div><div class="rmsg">${res.stars===3?'¡Perfecto!':res.stars===2?'¡Muy bien!':'¡Bien! Puedes mejorar'}</div>${grid}${extra}<div class="rbtns">${btns}</div>${!itemDone&&res.stars>=2&&!rec&&!nb.length?'<div class="autobar"><i></i></div>':''}</div>`;
  $('#stage').appendChild(ov);
  if(!itemDone&&res.stars>=2&&!rec&&!nb.length)S.autoT=setTimeout(()=>{if(S.screen==='play'&&S.session===ss)renderPlay();},4000);
}

    return `<tr><td><button class="btn ghost sm" data-act="rsel" data-id="${s.id}">${s.avatar} ${esc(s.name)}</button>${DB.classes.length&&!curCls()&&s.classId?` <span class="muted small">${esc(clsName(s.classId))}</span>`:''}</td><td>${rs.length}</td><td>${rs.reduce((a,r)=>a+r.stars,0)}</td><td>${A?A.prec+'%':'–'}</td><td>${A?fmt(A.t)+' s':'–'}</td><td>${A?fmt(A.outs):'–'}</td><td>${A?fmt(A.dir):'–'}</td><td>${(s.missions||[]).length}</td><td>${(s.recs||0)}</td></tr>`;}).join('');
  let detail='';const st=DB.students.find(s=>s.id===S.rsid);
  if(st){
    const rs=DB.results.filter(r=>r.sid===st.id);const groups={};
    rs.forEach(r=>{const k=r.set+'|'+(r.style||'')+'|'+r.item;(groups[k]=groups[k]||[]).push(r);});
    const order=Object.keys(SETS);
    const keys=Object.keys(groups).sort((a,b)=>{const [sa]=a.split('|'),[sb]=b.split('|');return order.indexOf(sa)-order.indexOf(sb)||a.localeCompare(b,'es');});
    detail=`<div class="card"><div class="row"><h2 class="grow" style="margin:0">${st.avatar} ${esc(st.name)} · por elemento</h2><button class="btn ghost sm" data-act="rsel" data-id="">Cerrar</button></div>
     <div class="tscroll" style="margin-top:10px"><table><thead><tr><th>Conjunto</th><th>Elemento</th><th>Veces</th><th>Mejor tiempo</th><th>Mejor precisión</th><th>Precisión media</th><th>Salidas/vez</th><th>Dirección/vez</th><th>Vel. media (u/s)</th><th>Tamaño máx.</th><th>Último</th></tr></thead><tbody>
     ${keys.map(k=>{const g=groups[k],A=agg(g),r0=g[g.length-1];return `<tr><td>${esc(setLabel(r0.set,r0.style))}</td><td><b>${esc(itemLabel(r0.set,r0.item))}</b></td><td>${A.n}</td><td>${fmt(A.bt)} s</td><td>${A.bp}%</td><td>${A.prec}%</td><td>${fmt(A.outs)}</td><td>${fmt(A.dir)}</td><td>${fmt(A.sp)}</td><td>${Math.max(...g.map(r=>r.size))}</td><td>${new Date(r0.date).toLocaleDateString('es-ES')}</td></tr>`;}).join('')||'<tr><td colspan="11" class="muted">Sin resultados todavía.</td></tr>'}
     </tbody></table></div>
     <h3 style="margin-top:16px">Últimos intentos</h3><div class="tscroll"><table><thead><tr><th>Fecha</th><th>Elemento</th><th>Modo</th><th>Tam.</th><th>Tiempo</th><th>Precisión</th><th>Salidas</th><th>Dirección</th><th>Reinicios</th><th>⭐</th></tr></thead><tbody>
     ${rs.slice(-40).reverse().map(r=>`<tr><td>${new Date(r.date).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(itemLabel(r.set,r.item))}${r.rec?' 🏆':''}</td><td>${r.mode==='ball'?'Bola':'Sin bola'}</td><td>${r.size}</td><td>${fmt(r.t)} s</td><td>${r.prec}%</td><td>${r.outs}</td><td>${r.dir}</td><td>${r.inval||0}</td><td>${'⭐'.repeat(r.stars)}</td></tr>`).join('')}
     </tbody></table></div></div>`;
  }
  return `<div class="card"><div class="row"><h2 class="grow" style="margin:0">Resumen de la clase</h2><button class="btn" data-act="csv">⬇️ Exportar CSV</button></div>${clsBar()}<p class="muted small">Medias de los últimos 20 trazos de cada alumno. Toca un nombre para ver el detalle por letra o forma.${curCls()?' El CSV exporta solo esta clase.':''}</p>
   <div class="tscroll"><table><thead><tr><th>Alumno</th><th>Trazos</th><th>⭐</th><th>Precisión</th><th>Tiempo medio</th><th>Salidas/trazo</th><th>Dirección/trazo</th><th>Misiones</th><th>Récords</th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="muted">Sin alumnos.</td></tr>'}</tbody></table></div></div>${detail}`;
}

    ${tg('freePlay','Permitir práctica libre a los alumnos')}${tg('sound','Sonidos')}${tg('voice','Voz de ánimo (voz del sistema)')}
    <div class="row"><label class="grow" style="font-weight:800">Exigencia por defecto</label><div class="seg">${Object.entries(STRICT_N).map(([k,v])=>`<button class="${s.strict===k?'on':''}" data-act="setStrict" data-v="${k}">${v}</button>`).join('')}</div></div>
    <div class="row"><label class="grow" style="font-weight:800">Parada máxima por defecto (práctica libre y tareas nuevas)</label><div class="seg">${STOP_OPTS.map(([v,n])=>`<button class="${(s.stop??2)===v?'on':''}" data-act="setStop" data-v="${v}">${n}</button>`).join('')}</div></div>
    <div class="row"><label class="grow" style="font-weight:800">PIN docente</label><input class="txtin" id="newPin" inputmode="numeric" maxlength="8" placeholder="Nuevo PIN (4-8 cifras)" style="max-width:220px;min-width:140px"><button class="btn sm" data-act="setPin">Cambiar</button></div>
   </div></div>
   <div class="card"><h2>💾 Copia de seguridad</h2><p class="muted small">Los datos se guardan <b>solo en este dispositivo y navegador</b>. Para pasarlos a otra tableta o a tu ordenador, exporta aquí e importa allí. «Combinar» suma alumnos, tareas y resultados sin borrar lo que ya hay.</p>
    <div class="row"><button class="btn" data-act="expJSON">⬇️ Exportar copia (.json)</button><label class="btn ghost">📥 Importar copia<input type="file" id="impFile" accept=".json,application/json" hidden></label></div>
    <p class="muted small">${DB.classes.length} clases · ${(DB.groups||[]).length} grupos · ${DB.students.length} alumnos · ${DB.assignments.length} tareas · ${DB.results.length} resultados</p></div>
   <div class="card"><h2>📏 Cómo se mide</h2><ul class="help muted">
    <li><b>Precisión</b>: porcentaje del recorrido del dedo que queda dentro del camino de la letra.</li>
    <li><b>Salida</b>: cada vez que el dedo se aleja del camino más de lo que permite la exigencia. En modo bola, la bola se suelta y hay que volver a cogerla.</li>
    <li><b>Dirección</b>: ir hacia atrás por el camino o empezar el trazo por otro punto (modo sin bola).</li>
    <li><b>Reinicios</b>: si se levanta el dedo a mitad de un trazo o se queda parado más tiempo del permitido, el intento no vale y vuelve a empezar desde el principio. Se anota cuántas veces ha tenido que empezar de nuevo. Levantar el dedo entre un trazo y el siguiente (punto de la i, raya de la t, mayúsculas de varios trazos) sí está permitido.</li>
    <li><b>Velocidad (u/s)</b>: longitud del camino en unidades de la rejilla por segundo (60 u = altura de una mayúscula). Sirve para comparar al mismo alumno en el tiempo; no son centímetros.</li>
    <li><b>Estrellas</b>: ⭐⭐⭐ ≥90% de precisión, sin salidas y sin errores de dirección · ⭐⭐ ≥75%, hasta 2 salidas y 1 error · ⭐ resto.</li>
    <li><b>Récord</b>: se guarda por alumno, elemento, modo y tamaño. Se bate al mejorar el tiempo (con ⭐⭐ o más) o la precisión.</li>
   </ul></div>
   <div class="card"><h2>ℹ️ Créditos</h2><p class="muted small">TRAZOS by GALURA S.L. · © ${new Date().getFullYear()} GALURA S.L. Todos los derechos reservados.<br>La letra enlazada se ha trazado a partir de Playwrite ES (TypeTogether) y la tipografía de pantalla es Fredoka; ambas tienen licencia SIL Open Font License.</p></div>
   <div class="card"><h2>🧹 Borrar</h2><div class="row"><button class="btn danger" data-act="wipeRes">Borrar todos los resultados</button><button class="btn danger" data-act="wipeAll">Borrar todo</button></div></div>`;
}
function exportCSV(){
  const H=['fecha','alumno','clase','tarea','actividad','conjunto','estilo','elemento','modo','tamaño','exigencia','ayudas','tiempo_s','precision_pct','salidas','errores_direccion','reinicios','velocidad_u_s','estrellas','record'];
  const q=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const lines=DB.results.filter(r=>{const s=DB.students.find(x=>x.id===r.sid);return !curCls()||(s&&inCls(s));}).map(r=>{const s=DB.students.find(x=>x.id===r.sid);const a=DB.assignments.find(x=>x.id===r.aid);
    return [new Date(r.date).toLocaleString('es-ES'),s?s.name:'(eliminado)',s?clsName(s.classId):'',a?a.title:'Práctica libre',r.activity||'trace',SETS[r.set]?.name||r.set,r.style?STYLE_N[r.style]||r.style:'',itemLabel(r.set,r.item),r.mode==='ball'?'Con bola':'Sin bola',r.size,r.strict,r.helps,String(r.t).replace('.',','),r.prec,r.outs,r.dir,r.inval||0,String(r.speed).replace('.',','),r.stars,r.rec?'sí':''].map(q).join(';');});
  download(`trazos_resultados_${new Date().toISOString().slice(0,10)}.csv`,'﻿'+[H.join(';'),...lines].join('\n'),'text/csv;charset=utf-8');
}
function mergeDB(inc){
  DB.classes=DB.classes||[];DB.groups=DB.groups||[];['classes','groups','students','assignments'].forEach(k=>{DB[k]=DB[k]||[];const m=new Map(DB[k].map(x=>[x.id,x]));(inc[k]||[]).forEach(x=>{const o=m.get(x.id);if(!o)DB[k].push(x);else{const pts=Math.max(o.points||0,x.points||0);Object.assign(o,x);if(k==='students'){o.points=pts;}}});});
  const ids=new Set(DB.results.map(r=>r.id));(inc.results||[]).forEach(r=>{if(!ids.has(r.id))DB.results.push(r);});
  DB.results.sort((a,b)=>a.date<b.date?-1:1);
  for(const sid in (inc.records||{})){const R=DB.records[sid]||(DB.records[sid]={});for(const k in inc.records[sid]){const a=R[k],b=inc.records[sid][k];R[k]=!a?b:{t:Math.min(a.t,b.t),prec:Math.max(a.prec,b.prec)};}}
}

  if(el.dataset.sgroup){const s=DB.students.find(x=>x.id===el.dataset.sgroup);if(s){if(el.value)s.groupId=el.value;else delete s.groupId;save();render();}}
  if(el.dataset.gname){const g=(DB.groups||[]).find(x=>x.id===el.dataset.gname);if(g&&el.value.trim()){g.name=el.value.trim();save();render();}}
  if(el.dataset.cname){const k=DB.classes.find(x=>x.id===el.dataset.cname);if(k&&el.value.trim()){k.name=el.value.trim();save();render();}}
  if(el.dataset.sname){const s=DB.students.find(x=>x.id===el.dataset.sname);if(s&&el.value.trim()){s.name=el.value.trim();save();}}
  if(el.id==='impFile'&&el.files&&el.files[0]){const fr=new FileReader();fr.onload=()=>{let inc;try{inc=JSON.parse(fr.result);if(!inc||!Array.isArray(inc.students))throw 0;}catch(_){info('Ese archivo no es una copia válida de TRAZOS.');return;}
    const m=modal(`<h3>📥 Importar copia</h3><p>La copia tiene <b>${inc.students.length}</b> alumnos, <b>${(inc.assignments||[]).length}</b> tareas y <b>${(inc.results||[]).length}</b> resultados.</p><div class="row end" style="margin-top:14px"><button class="btn ghost" data-x="no">Cancelar</button><button class="btn" data-x="merge">Combinar</button><button class="btn danger" data-x="rep">Reemplazar todo</button></div>`);
    m.querySelector('[data-x=no]').onclick=()=>m.close();
    m.querySelector('[data-x=merge]').onclick=()=>{mergeDB(inc);save();m.close();render();info('Copia combinada ✅');};
    m.querySelector('[data-x=rep]').onclick=()=>{DB=Object.assign(defaultDB(),inc);DB.classes=DB.classes||[];DB.groups=DB.groups||[];DB.settings=Object.assign(defaultDB().settings,inc.settings||{});save();m.close();render();info('Copia restaurada ✅');};
  };fr.readAsText(el.files[0]);el.value='';}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ptext'){S.practice.text=e.target.value;render();}});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
if(window.speechSynthesis)try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};}catch(e){}

/* Pantalla completa sin barras del navegador. Solo puede activarse tras un toque (lo exige el navegador). */
const FS_EL=document.documentElement;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone;
function enterFS(){try{const f=FS_EL.requestFullscreen||FS_EL.webkitRequestFullscreen;if(f&&!document.fullscreenElement&&!document.webkitFullscreenElement){const r=f.call(FS_EL,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{});}}catch(e){}}
function toggleFS(){if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}else enterFS();}
document.addEventListener('pointerup',e=>{if(e.pointerType==='touch'&&!isStandalone()&&!e.target.closest('[data-act=fs]'))enterFS();},{capture:true});
load();render();
/* Instalable y sin internet: registra el service worker (solo cuando se sirve por https o localhost). */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
